# Mantém o backend (Render free) SEMPRE acordado: pinga /api/health a cada 10 min.
# Roda na infra do GitHub (grátis). Evita o cold-start (~50s) e o adormecer.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (Render hiberna após 15 min ocioso)
  workflow_dispatch: {}       # permite rodar manualmente também
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping health
        run: curl -fsS -m 90 https://carprice-api-8xur.onrender.com/api/health || true
