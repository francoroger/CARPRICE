# Deploy do BACKEND (FastAPI) no Render (https://render.com) — blueprint.
# Render → New → Blueprint → aponta pro repo. Cria o serviço automaticamente.
# A busca usa só httpx (Nível 1), então NÃO precisa de Playwright/navegador aqui.
services:
  - type: web
    name: carprice-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: "."
      - key: SCHEDULER_ENABLED
        value: "true"           # mantido on via keep-warm → varredura agendada roda
      - key: CORS_ORIGINS
        value: "*"
      # Banco PERMANENTE (Aiven Postgres "pricecar"). O VALOR (com senha) é definido
      # no painel do Render (Environment) — sync:false mantém o segredo fora do git.
      # Formato: postgresql://avnadmin:SENHA@HOST:PORTA/pricecar?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Segredo do JWT (login). Defina um valor aleatório no painel do Render.
      - key: JWT_SECRET
        sync: false
