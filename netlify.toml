# Deploy do FRONTEND (React/Vite) no Netlify.
# O frontend chama o backend (Render) DIRETO via VITE_API_URL — evita o timeout do
# proxy do Netlify nas buscas longas (~100s). CORS liberado no backend.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # URL do backend no Render (trocar se mudar de host):
  VITE_API_URL = "https://carprice-api-8xur.onrender.com"

# SPA: qualquer rota do front cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
