services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: carprice
      POSTGRES_PASSWORD: carprice
      POSTGRES_DB: carprice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carprice"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://carprice:carprice@db:5432/carprice
      SCHEDULER_ENABLED: "true"
      SCRAPE_DEFAULT_INTERVAL_MIN: "60"
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
